name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build APK
      run: |
        FILE=$(find . -name "settings.gradle.kts" | head -n 1)
        DIR=$(dirname "$FILE")
        echo "Entrando na pasta: $DIR"
        cd "$DIR"
        
        # Usa o gradle global em vez do ./gradlew
        gradle assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app-debug.apk"
