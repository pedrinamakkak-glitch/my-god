name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Find and Build APK
      run: |
        echo "Iniciando busca..."
        if ls *.zip 1> /dev/null 2>&1; then
          echo "Zip encontrado! Descompactando..."
          unzip -q *.zip -d projeto_descompactado
          cd projeto_descompactado
        fi
        
        FILE=$(find . -name "settings.gradle.kts" | head -n 1)
        DIR=$(dirname "$FILE")
        echo "Projeto encontrado na pasta: $DIR"
        cd "$DIR"
        
        gradle wrapper
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app-debug.apk"
