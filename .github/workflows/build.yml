name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Descompactar e Buildar
      run: |
        # Descompacta o zip do projeto
        unzip -q meu-virus.zip -d projeto_descompactado
        cd projeto_descompactado/meu-virus
        # Compila
        gradle wrapper
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: projeto_descompactado/meu-virus/app/build/outputs/apk/debug/app-debug.apk
